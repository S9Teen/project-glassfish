<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F9F9F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#071221" media="(prefers-color-scheme: dark)" />
    <title>VitroSak — Tempered Glass Manufacturing</title>
    <meta name="description" content="VitroSak manufactures high-quality tempered glass for homes, offices and events." />
    <link rel="icon" type="image/svg+xml" href="brand/logo-symbol.svg" />
    <link rel="apple-touch-icon" href="brand/logo-symbol.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Apply saved / system theme before first paint to avoid a flash -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
